<style>
  :root{
    --ink:#232a3a;
    --box-bg:#f8f8f0;
    --box-border:#5a6478;
    --accent:#e04038;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:#0e1220;
    background-image:
      radial-gradient(circle at 20% 10%, #1a2240 0%, transparent 50%),
      radial-gradient(circle at 80% 90%, #251a3a 0%, transparent 50%);
    color:#e8e8f0;
    font-family:'Press Start 2P', 'Courier New', monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:12px; overflow:hidden;
  }

  #frame{
    position:relative;
    background:#2a3050;
    border:4px solid #3c4468;
    border-radius:14px;
    padding:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.08);
  }
  #screenWrap{
    position:relative;
    background:#000;
    border:4px solid #10141f;
    border-radius:4px;
    overflow:hidden;
    line-height:0;
  }
  canvas{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    display:block;
  }

  /* ---------- Dialog box (FireRed style) ---------- */
  #dialog{
    position:absolute; left:2%; right:2%; bottom:2.5%;
    background:var(--box-bg);
    border:3px solid var(--box-border);
    border-radius:6px;
    box-shadow:0 0 0 3px #f8f8f0, 0 0 0 6px #303848, 0 4px 0 6px rgba(0,0,0,.35);
    padding:12px 14px 14px;
    color:var(--ink);
    display:none;
    z-index:5;
  }
  #dialog.open{ display:block; }
  #dlgTitle{
    display:inline-block;
    font-size:8px;
    letter-spacing:.5px;
    color:#fff;
    background:var(--accent);
    border:2px solid #8c1f1a;
    border-radius:3px;
    padding:4px 7px 3px;
    margin-bottom:8px;
  }
  #dlgText{
    font-size:10px;
    line-height:1.9;
    min-height:58px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #dlgText a{ color:#2050c8; }
  #dlgNext{
    position:absolute; right:12px; bottom:8px;
    color:var(--accent);
    font-size:10px;
    animation:bob .5s steps(2) infinite;
  }
  @keyframes bob{ 0%{transform:translateY(0)} 100%{transform:translateY(3px)} }

  /* ---------- Title overlay ---------- */
  #title{
    position:absolute; inset:0; z-index:10;
    background:linear-gradient(180deg,#182448 0%, #23366b 55%, #101a35 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:18px; padding:20px;
  }
  #title h1{
    font-size:clamp(14px, 3.2vw, 22px);
    color:#ffd83c;
    text-shadow:2px 2px 0 #a03020, 4px 4px 0 rgba(0,0,0,.45);
    line-height:1.6;
  }
  #title .sub{ font-size:8px; color:#9fb4ff; line-height:1.8; }
  #pressStart{
    font-size:10px; color:#fff;
    animation:blink 1.1s steps(2) infinite;
    cursor:pointer;
    border:0; background:none; font-family:inherit;
    padding:10px 14px;
  }
  @keyframes blink{ 0%{opacity:1} 100%{opacity:.15} }

  /* ---------- HUD under the frame ---------- */
  #hud{
    display:flex; gap:10px; align-items:center; justify-content:space-between;
    margin-top:12px; width:100%;
  }
  #hint{ font-size:7px; color:#8a93b8; line-height:1.9; }
  #muteBtn{
    font-family:inherit; font-size:8px; color:#e8e8f0;
    background:#39406a; border:2px solid #565f96; border-radius:6px;
    padding:7px 10px; cursor:pointer; white-space:nowrap;
  }
  #muteBtn:active{ transform:translateY(1px); }

  /* ---------- Touch controls ---------- */
  #touchUI{ display:none; width:100%; margin-top:14px; justify-content:space-between; align-items:center; user-select:none; }
  @media (pointer:coarse){
    #touchUI{ display:flex; }
    #hint{ display:none; }
  }
  .dpad{ position:relative; width:120px; height:120px; }
  .dbtn{
    position:absolute; width:40px; height:40px;
    background:#39406a; border:2px solid #565f96; border-radius:8px;
    color:#cfd6ff; font-size:12px; font-family:inherit;
    display:flex; align-items:center; justify-content:center;
  }
  .dbtn:active,.dbtn.held{ background:#4b548c; }
  #dUp{ left:40px; top:0; } #dDown{ left:40px; top:80px; }

  #aBtn{

    background:#c8403a; border:3px solid #8c1f1a;
    color:#fff; font-family:inherit; font-size:14px;
    box-shadow:0 4px 0 #701512;
  }
  #aBtn:active{ transform:translateY(2px); box-shadow:0 2px 0 #701512; }

  #madeWith{ margin-top:10px; font-size:6px; color:#4a5378; }
</style>

/* Integer upscale to fit the window */
function fitScreen(){
  const pad = 90;
  const maxW = Math.min(window.innerWidth - 60, 900);
  const maxH = window.innerHeight - pad - 140;
  let s = Math.floor(Math.min(maxW / 256, maxH / 192));
  if (s < 1) s = Math.min(maxW / 256, maxH / 192); // tiny screens: allow fractional
  cvs.style.width  = (256 * s) + "px";
  cvs.style.height = (192 * s) + "px";
  document.getElementById("hud").style.width = cvs.style.width;
  document.getElementById("touchUI").style.width = cvs.style.width;
}
window.addEventListener("resize", fitScreen);
fitScreen();

function buildSprite(head, body, mirror, pal){
  const P = pal || PAL;
  const rows = head.concat(body);
  const H = rows.length;
  const c = document.createElement("canvas");
  c.width = 16; c.height = H;
  const g = c.getContext("2d");
  for (let y=0; y<H; y++){
    const row = (rows[y]||"").padEnd(16, ".");
    for (let x=0; x<16; x++){
      const ch = row[x];
      if (ch !== "." && P[ch]){ g.fillStyle = P[ch]; g.fillRect(x, y, 1, 1); }
    }
  }
  if (!mirror) return c;
  const m = document.createElement("canvas");
  m.width = 16; m.height = H;
  const mg = m.getContext("2d");
  mg.translate(16,0); mg.scale(-1,1); mg.drawImage(c,0,0);
  return m;
}
function mirrorRows(rows){ return rows.map(r => r.padEnd(16,".").split("").reverse().join("")); }

  up:    [ buildSprite(HEAD_UP, BODY_UP_STAND),

           buildSprite(HEAD_SIDE, BODY_SIDE_STAND, true) ],

  const c = document.createElement("canvas");
  c.width = 32; c.height = 32;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  /* rounded GBA-frame backdrop so it pops on both light & dark tab bars */
  g.fillStyle = "#3c4468";
  if (g.roundRect){ g.beginPath(); g.roundRect(0,0,32,32,7); g.fill(); }
  else g.fillRect(0,0,32,32);
  g.fillStyle = "#2a3050";
  if (g.roundRect){ g.beginPath(); g.roundRect(2,2,28,28,5); g.fill(); }
  else g.fillRect(2,2,28,28);
  /* the head = top 12 rows of the down-facing sprite, scaled 2x (16:12 → 28:21) */
  g.drawImage(SPR.down[0], 0, 0, 16, 12, 2, 5, 28, 21);
  const url = c.toDataURL("image/png");
  for (const rel of ["icon", "apple-touch-icon"]){
    const l = document.createElement("link");
    l.rel = rel; l.href = url;
    document.head.appendChild(l);
  }
})();

/* ---------------- Room rendering (pre-baked background) ---------------- */
const bg = document.createElement("canvas");
bg.width = 256; bg.height = 192;
const bgx = bg.getContext("2d");

function tilePx(g, c, tx, ty, x, y, w=1, h=1){
  g.fillStyle = c; g.fillRect(tx*TILE + x, ty*TILE + y, w, h);
}

function drawRoom(g){
  for (let y=0; y<MAP_H; y++){
    for (let x=0; x<MAP_W; x++){
      const t = MAP[y][x];
      if (t === "U"){                                  // upper wall
        tilePx(g,"#98b8a0",x,y,0,0,16,16);
        tilePx(g,"#88a890",x,y,0,0,16,2);
        for (let i=0;i<4;i++) tilePx(g,"#8fb097",x,y,i*4+1,3,1,12);
        tilePx(g,"#78987f",x,y,0,14,16,2);
      } else if (t === "W"){                           // wood paneling
        tilePx(g,"#a8764a",x,y,0,0,16,16);
        tilePx(g,"#c08a58",x,y,0,0,16,2);
        tilePx(g,"#8a5c38",x,y,0,12,16,4);
        tilePx(g,"#754c2e",x,y,0,15,16,1);
        tilePx(g,"#96683f",x,y,5,2,1,10);
        tilePx(g,"#96683f",x,y,11,2,1,10);
      } else if (t === "S" || t === "B"){              // side & bottom walls
        tilePx(g,"#5c4630",x,y,0,0,16,16);
        tilePx(g,"#4a3826",x,y,0,0,16,1);
        tilePx(g,"#6a523a",x,y, (x+y)%2?2:8, 4, 3, 3);
      } else {                                         // wooden floor
        tilePx(g,"#e8c890",x,y,0,0,16,16);
        tilePx(g,"#dcb87c",x,y,0,7,16,1);
        tilePx(g,"#dcb87c",x,y,0,15,16,1);
        tilePx(g,"#d2ac6e",x,y,(y%2)?3:10,0,1,7);
        tilePx(g,"#d2ac6e",x,y,(y%2)?12:6,8,1,7);
        if (t === "r"){                                // rug
          tilePx(g,"#68a068",x,y,0,0,16,16);
          tilePx(g,"#569056",x,y,0,0,16,16);
          tilePx(g,"#68a868",x,y,1,1,14,14);
          if ((x+y)%2===0) tilePx(g,"#74b474",x,y,4,4,8,8);
        }
      }
    }
  }
  /* rug border */
  g.strokeStyle = "#3e7a3e"; g.lineWidth = 1;
  g.strokeRect(6*TILE+0.5, 5*TILE+0.5, 4*TILE-1, 3*TILE-1);
}

function bakeBackground(){
  drawRoom(bgx);
  for (const o of OBJECTS){
    const [x,y] = o.tiles[0];
    if (o.key==="bookshelf"){ drawBookshelf(bgx,1,1); drawBookshelf(bgx,2,1); }
    else if (o.key==="pc") drawPC(bgx,x,y);
    else if (o.key==="tv") drawTV(bgx,x,y);
    else if (o.key==="console") drawConsole(bgx,x,y);
    else if (o.key==="window") drawMountainWindow(bgx,x,y);
    else if (o.key==="poster") drawPoster(bgx,x,y);
    else if (o.key==="note") drawTable(bgx,x,y);
    else if (o.key==="plant") drawPlant(bgx,x,y);
    else if (o.key==="bed") drawBed(bgx,x,y);
    else if (o.key==="guitar") drawGuitar(bgx,x,y);
    else if (o.key==="bike") drawBike(bgx,x,y);
    else if (o.key==="coffee") drawCoffee(bgx,x,y);
    else if (o.key==="mat") drawMat(bgx,x,y);
  }
}
bakeBackground();

/* ---------------- Audio (Web Audio chiptune) ---------------- */
let AC = null, masterGain, musicGain, sfxGain, musicOn = true, musicTimer = null;
let noiseBuf = null;

function initAudio(){
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = AC.createGain(); masterGain.gain.value = 0.55; masterGain.connect(AC.destination);
  musicGain  = AC.createGain(); musicGain.gain.value  = musicOn ? 0.16 : 0; musicGain.connect(masterGain);
  sfxGain    = AC.createGain(); sfxGain.gain.value    = 0.5;  sfxGain.connect(masterGain);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  startMusic();
}

const f = m => 440 * Math.pow(2, (m-69)/12);

function tone(dest, type, midi, t, dur, vol, slideTo){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f(midi), t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(f(slideTo), t+dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t+dur+0.02);
}
function hat(t, vol){
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const g = AC.createGain(), hp = AC.createBiquadFilter();
  hp.type="highpass"; hp.frequency.value = 6500;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.05);
  s.connect(hp); hp.connect(g); g.connect(musicGain);
  s.start(t); s.stop(t+0.06);
}

/* A cheery 8-bar loop: melody / harmony / bass / hats */
const BPM = 132, EIGHTH = 60/BPM/2;
const MELODY = [   // one entry per eighth note (32 = 4 bars), 0 = rest
  72,0,76,0, 79,0,76,74,   74,0,71,0, 67,0,71,74,
  76,0,72,0, 69,0,72,76,   77,76,74,0, 72,0,74,0,
  72,0,76,0, 79,0,81,79,   79,0,74,0, 71,0,74,79,
  76,0,79,0, 84,0,81,79,   77,79,81,0, 84,0,0,0,
];
const BASSROOT = [48,43,45,41, 48,43,45,43]; // C G Am F | C G Am G (one per bar)
const LOOP_EIGHTHS = MELODY.length;

let musNext = 0, musStep = 0;
function scheduleMusic(){
  if (!AC || !musicOn) return;
  if (musNext < AC.currentTime) musNext = AC.currentTime + 0.02;
  while (musNext < AC.currentTime + 0.12){
    const i = musStep % LOOP_EIGHTHS;
    const bar = Math.floor(i/8);
    const m = MELODY[i];
    if (m) tone(musicGain, "square", m, musNext, EIGHTH*0.9, 0.30);
    if (i%2===0){
      const r = BASSROOT[bar % BASSROOT.length];
      tone(musicGain, "triangle", (i%8===4)? r+7 : r, musNext, EIGHTH*0.95, 0.5);
      hat(musNext, (i%8===0)? 0.12 : 0.05);
    }
    musNext += EIGHTH; musStep++;
  }
}
function startMusic(){
  musNext = AC.currentTime + 0.05; musStep = 0;
  if (musicTimer) clearInterval(musicTimer);
  musicTimer = setInterval(scheduleMusic, 30);
}
function setMusic(on){
  musicOn = on;
  document.getElementById("muteBtn").textContent = on ? "♪ MUSIC: ON" : "♪ MUSIC: OFF";
  if (AC) musicGain.gain.setTargetAtTime(on ? 0.16 : 0, AC.currentTime, 0.05);
}

/* SFX */
const sfx = {
  bump(){ if(!AC) return; tone(sfxGain,"square",45,AC.currentTime,0.09,0.35,40); },
  confirm(){ if(!AC) return; const t=AC.currentTime;
    tone(sfxGain,"square",76,t,0.06,0.3); tone(sfxGain,"square",83,t+0.07,0.09,0.3); },
  close(){ if(!AC) return; const t=AC.currentTime;
    tone(sfxGain,"square",83,t,0.05,0.25); tone(sfxGain,"square",76,t+0.06,0.08,0.25); },
  blip(){ if(!AC) return; tone(sfxGain,"square",88,AC.currentTime,0.025,0.12); },
  step(){ if(!AC) return; tone(sfxGain,"triangle",52,AC.currentTime,0.04,0.12); },
  guitar(){ if(!AC) return;               // E-minor strum, one string at a time
    const strings = [40,47,52,55,59,64];
    strings.forEach((m,i)=>{
      const t = AC.currentTime + i*0.045;
      tone(sfxGain,"triangle",m,t,0.55,0.22);
      tone(sfxGain,"square",m+12,t,0.18,0.05);   // pick attack sparkle
    });
  },
  brew(){ if(!AC) return;                  // bubbling coffee gurgle
    const t0 = AC.currentTime;
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const g = AC.createGain(), lp = AC.createBiquadFilter();
    lp.type="lowpass"; lp.frequency.value = 420;
    g.gain.setValueAtTime(0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0+0.7);
    s.connect(lp); lp.connect(g); g.connect(sfxGain);
    s.start(t0); s.stop(t0+0.7);
    [0.08,0.22,0.38,0.52].forEach((d,i)=>
      tone(sfxGain,"sine",55+((i*5)%9),t0+d,0.07,0.10,60+i));
  },
};

/* ---------------- Input ---------------- */
const held = { up:false, down:false, left:false, right:false };
let actionQueued = false;

const KEYMAP = {
  ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
  w:"up", s:"down", a:"left", d:"right", W:"up", S:"down", A:"left", D:"right",
};
window.addEventListener("keydown", e=>{
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  if (titleShowing && (e.key==="Enter" || e.key===" " || e.key==="z" || e.key==="Z")) { startGame(); return; }
  if (KEYMAP[e.key]) held[KEYMAP[e.key]] = true;
  if (["z","Z","Enter"," "].includes(e.key) && !e.repeat) actionQueued = true;
  if (e.key==="m" || e.key==="M") setMusic(!musicOn);
});
window.addEventListener("keyup", e=>{ if (KEYMAP[e.key]) held[KEYMAP[e.key]] = false; });

/* Touch controls */
function bindTouch(id, dir){
  const el = document.getElementById(id);
  const on  = ev=>{ ev.preventDefault(); held[dir]=true; el.classList.add("held"); if(titleShowing) startGame(); };
  const off = ev=>{ ev.preventDefault(); held[dir]=false; el.classList.remove("held"); };
  el.addEventListener("touchstart",on); el.addEventListener("touchend",off); el.addEventListener("touchcancel",off);
  el.addEventListener("mousedown",on);  el.addEventListener("mouseup",off);  el.addEventListener("mouseleave",off);
}
bindTouch("dUp","up"); bindTouch("dDown","down"); bindTouch("dLeft","left"); bindTouch("dRight","right");
document.getElementById("aBtn").addEventListener("touchstart", e=>{ e.preventDefault(); titleShowing ? startGame() : actionQueued = true; });
document.getElementById("aBtn").addEventListener("mousedown", e=>{ e.preventDefault(); titleShowing ? startGame() : actionQueued = true; });
document.getElementById("muteBtn").addEventListener("click", ()=> setMusic(!musicOn));

/* ---------------- Player (free 8-way movement) ---------------- */
const player = {
  px:7*TILE, py:8*TILE,     // pixel position (top-left of 16px sprite base)
  facing:"up",
  moving:false, animDist:0, stepAcc:0, bumpCd:0,
};
const SPEED = 96;           // pixels per second — snappy!

/* Feet-area hitbox (head can overlap furniture above, GBA-style) */
function hitboxCollides(x, y){
  const l = x+3, r = x+12, t = y+6, b = y+15;
  const x0 = Math.floor(l/TILE), x1 = Math.floor(r/TILE);
  const y0 = Math.floor(t/TILE), y1 = Math.floor(b/TILE);
  for (let ty=y0; ty<=y1; ty++)
    for (let tx=x0; tx<=x1; tx++)
      if (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H||solid.has(tx+","+ty)) return true;
  return false;
}
function playerTile(){
  return [Math.floor((player.px+8)/TILE), Math.floor((player.py+11)/TILE)];
}
function facingTile(){
  const d = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] }[player.facing];
  const [tx,ty] = playerTile();
  return [tx+d[0], ty+d[1]];
}

/* ---------------- Dialog system ---------------- */
const dlg   = document.getElementById("dialog");
const dlgT  = document.getElementById("dlgTitle");
const dlgX  = document.getElementById("dlgText");
const dlgN  = document.getElementById("dlgNext");
let dialogOpen = false, pages = [], pageIdx = 0, charIdx = 0, typing = false, typeTimer = null;

function openDialog(content, key){
  dialogOpen = true; pages = content.pages; pageIdx = 0;
  dlgT.textContent = content.title;
  dlg.classList.add("open");
  if (key === "guitar") sfx.guitar();
  else if (key === "coffee") sfx.brew();
  else sfx.confirm();
  showPage();
}
function showPage(){
  clearInterval(typeTimer);
  charIdx = 0; typing = true; dlgX.textContent = ""; dlgN.style.visibility = "hidden";
  const text = pages[pageIdx];
  typeTimer = setInterval(()=>{
    charIdx += 1;
    dlgX.textContent = text.slice(0, charIdx);
    if (charIdx % 3 === 0) sfx.blip();
    if (charIdx >= text.length){
      clearInterval(typeTimer); typing = false; dlgN.style.visibility = "visible";
      dlgN.textContent = (pageIdx < pages.length-1) ? "▼" : "✕";
    }
  }, 18);
}
function advanceDialog(){
  if (typing){                     // fast-forward
    clearInterval(typeTimer); typing = false;
    dlgX.textContent = pages[pageIdx];
    dlgN.style.visibility = "visible";
    dlgN.textContent = (pageIdx < pages.length-1) ? "▼" : "✕";
    return;
  }
  if (pageIdx < pages.length-1){ pageIdx++; sfx.confirm(); showPage(); }
  else { dialogOpen = false; dlg.classList.remove("open"); sfx.close(); }
}

/* ---------------- Title / start ---------------- */
let titleShowing = true, started = false;
document.getElementById("titleName").textContent = CONTENT.gameTitle;
document.getElementById("pressStart").addEventListener("click", startGame);

function startGame(){
  if (!titleShowing) return;
  titleShowing = false;
  document.getElementById("title").style.display = "none";
  initAudio();
  if (AC && AC.state === "suspended") AC.resume();
  if (!started){ started = true; setTimeout(()=> openDialog(CONTENT.intro), 350); }
}

/* ---------------- Main loop ---------------- */
let last = performance.now();
function loop(now){
  const dt = Math.min((now - last)/1000, 0.05);
  last = now;
  update(dt);
  render(now/1000);
  requestAnimationFrame(loop);
}

function update(dt){
  if (player.bumpCd > 0) player.bumpCd -= dt; else player.bumpCd = 0;

  if (!titleShowing && !dialogOpen){
    if (actionQueued){
      actionQueued = false;
      const [fx,fy] = facingTile();
      const obj = interact.get(fx+","+fy);
      if (obj && CONTENT[obj.key]) openDialog(CONTENT[obj.key], obj.key);
    }

    const dx = (held.right?1:0) - (held.left?1:0);
    const dy = (held.down?1:0)  - (held.up?1:0);
    player.moving = !!(dx || dy);

    if (player.moving){
      /* face horizontal on diagonals (side sprites read best) */
      if (dx) player.facing = dx > 0 ? "right" : "left";
      else    player.facing = dy > 0 ? "down"  : "up";

      const inv = (dx && dy) ? Math.SQRT1_2 : 1;   // normalize diagonals
      const vx = dx * SPEED * inv * dt;
      const vy = dy * SPEED * inv * dt;

      /* move each axis separately → slide along walls */
      let moved = 0;
      if (vx){
        const nx = player.px + vx;
        if (!hitboxCollides(nx, player.py)){ player.px = nx; moved += Math.abs(vx); }
      }
      if (vy){
        const ny = player.py + vy;
        if (!hitboxCollides(player.px, ny)){ player.py = ny; moved += Math.abs(vy); }
      }

      if (moved > 0.001){
        player.animDist += moved;
        player.stepAcc  += moved;
        if (player.stepAcc >= TILE){ player.stepAcc = 0; sfx.step(); }
      } else if (!player.bumpCd){
        sfx.bump(); player.bumpCd = 0.4;
      }
    } else {
      player.animDist = 0; player.stepAcc = TILE * 0.6; // first step sounds quickly
    }
  } else if (dialogOpen && actionQueued){
    actionQueued = false;
    advanceDialog();
  } else {
    actionQueued = false;
  }
}

function render(t){
  ctx.drawImage(bg, 0, 0);

  /* interaction marker over the object you're facing */
  if (!titleShowing && !dialogOpen){
    const [fx,fy] = facingTile();
    const obj = interact.get(fx+","+fy);
    if (obj && CONTENT[obj.key]){
      const bobY = Math.floor(Math.sin(t*6)*1.5);
      const mx = fx*TILE + 8, my = fy*TILE - 6 + bobY;
      px("#20242c", mx-3, my-1, 7, 7);
      px("#e04038", mx-2, my,   5, 4);
      px("#e04038", mx-1, my+4, 3, 1);
      px("#f8f8f8", mx-1, my+1, 1, 2);
    }
  }

  /* entities, painter's order: NPCs behind the player first, then player, then NPCs in front */
  for (const n of NPCS) if (n.y*TILE <= player.py) drawNPC(n);

  /* player sprite — walk cycle driven by distance traveled */
  let frame = 0;
  if (player.moving){
    const seq = [1, 0, 2, 0];
    frame = seq[Math.floor(player.animDist / 9) % 4];
  }
  ctx.drawImage(SPR[player.facing][frame], Math.round(player.px), Math.round(player.py) - 5);

  for (const n of NPCS) if (n.y*TILE > player.py) drawNPC(n);
}
requestAnimationFrame(loop);
</script>
</body>
