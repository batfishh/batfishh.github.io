<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <style>

            background: black;

        canvas {
            display: block;
            cursor: none;

<body>
    <canvas id="canvas"></canvas>

    <script>
        // ---- CANVAS ----
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        let mouse = { x: width / 2, y: height / 2 };
        let bh = { x: width / 2, y: height / 2 };
        window.addEventListener("mousemove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

        // ---- MOBILE GYRO POINTER ----
        const isTouchDevice = window.matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
        let gyroEnabled = false;
        let gyroBase = null;
        let motionBase = null;
        let orientationActive = false;

        function clampTilt(value) {
            return Math.max(-1, Math.min(1, value));
        }

        function setGyroMouse(tiltX, tiltY) {
            mouse.x = width / 2 + clampTilt(tiltX) * width * 0.48;
            mouse.y = height / 2 + clampTilt(tiltY) * height * 0.48;
        }

        function handleOrientation(e) {
            if (!isTouchDevice) return;

            const beta = e.beta;   // front/back tilt, roughly -180..180
            const gamma = e.gamma; // left/right tilt, roughly -90..90
            if (beta === null || gamma === null) return;

            orientationActive = true;
            if (!gyroBase) gyroBase = { beta, gamma };

            setGyroMouse((gamma - gyroBase.gamma) / 35, (beta - gyroBase.beta) / 35);
        }

        function handleMotion(e) {
            if (!isTouchDevice || orientationActive) return;

            const gravity = e.accelerationIncludingGravity;
            if (!gravity || gravity.x === null || gravity.y === null) return;

            if (!motionBase) motionBase = { x: gravity.x, y: gravity.y };

            setGyroMouse((gravity.x - motionBase.x) / 5, (motionBase.y - gravity.y) / 5);
        }

        function enableGyroPointer() {
            if (!isTouchDevice || gyroEnabled) return;

            const start = () => {
                if ("DeviceOrientationEvent" in window) {
                    window.addEventListener("deviceorientation", handleOrientation);
                }
                if ("DeviceMotionEvent" in window) {
                    window.addEventListener("devicemotion", handleMotion);
                }
                gyroEnabled = true;
            };

            const orientationPermission = "DeviceOrientationEvent" in window &&
                typeof DeviceOrientationEvent.requestPermission === "function"
                ? DeviceOrientationEvent.requestPermission()
                : Promise.resolve("granted");
            const motionPermission = "DeviceMotionEvent" in window &&
                typeof DeviceMotionEvent.requestPermission === "function"
                ? DeviceMotionEvent.requestPermission()
                : Promise.resolve("granted");

            Promise.allSettled([orientationPermission, motionPermission]).then((results) => {
                if (results.some((result) => result.status === "fulfilled" && result.value === "granted")) {
                    start();
                }
            });

            if (!("DeviceOrientationEvent" in window) && !("DeviceMotionEvent" in window)) {
                start();
            }
        }

        window.addEventListener("touchstart", enableGyroPointer, { once: true, passive: true });
        window.addEventListener("resize", () => { gyroBase = null; motionBase = null; });
        window.addEventListener("orientationchange", () => { gyroBase = null; motionBase = null; });

        let t = 0;

        // ---- PERF TIER ----
        // Scale particle counts down on low-core CPUs so the scene stays smooth.
        const isLowEnd = (navigator.hardwareConcurrency || 4) < 4;
        const STAR_COUNT = isLowEnd ? 500 : 900;
        const PARTICLE_COUNT = isLowEnd ? 1300 : 2200;
        const JET_COUNT = isLowEnd ? 150 : 260;

        // ---- NEBULAE (slow-drifting cosmic dust) ----
        const nebulae = [];
        for (let i = 0; i < 5; i++) {
            nebulae.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                r: 260 + Math.random() * 380,
                hue: 230 + Math.random() * 110,    // purple → magenta range
                vx: (Math.random() - 0.5) * 0.08,
                vy: (Math.random() - 0.5) * 0.08,
                intensity: 0.04 + Math.random() * 0.035
            });
        }

        // ---- STARS ----
        const stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                b: 0.3 + Math.random() * 0.7,
                size: Math.random() < 0.85 ? 0.8 + Math.random() * 0.8 : 1.6 + Math.random() * 1.4,
                phase: Math.random() * Math.PI * 2
            });
        }

        // ---- SHOOTING STARS ----
        const shootingStars = [];
        function spawnShootingStar() {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.max(width, height) * 0.65;
            const cx = width / 2, cy = height / 2;
            const sx = cx + Math.cos(angle) * dist * 1.2;
            const sy = cy + Math.sin(angle) * dist * 1.2;
            const dirAngle = angle + Math.PI + (Math.random() - 0.5) * 0.7;
            const length = dist * (1.6 + Math.random() * 0.6);
            shootingStars.push({
                sx, sy,
                dx: Math.cos(dirAngle), dy: Math.sin(dirAngle),
                length, progress: 0,
                speed: 0.012 + Math.random() * 0.015,
                hue: Math.random() < 0.55 ? 200 + Math.random() * 30  // cool blue
                    : 35 + Math.random() * 25  // warm gold
            });
        }
        setInterval(() => {
            if (Math.random() < 0.6 && shootingStars.length < 4) spawnShootingStar();
        }, 2200);

        // ---- ACCRETION DISK PARTICLES ----
        const particles = [];
        const innerCount = Math.floor(PARTICLE_COUNT * 0.64);
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const inner = i < innerCount;
            particles.push({
                angle: Math.random() * Math.PI * 2,
                radius: inner ? 65 + Math.random() * 110 : 175 + Math.random() * 130,
                speed: inner ? 0.005 + Math.random() * 0.006 : 0.002 + Math.random() * 0.003,
                size: inner ? 0.8 + Math.random() * 1.4 : 0.4 + Math.random() * 0.9,
                hueOffset: Math.random() * 60
            });
        }

        // ---- JETS ----
        const jets = [];
        for (let i = 0; i < JET_COUNT; i++) {
            jets.push({
                progress: Math.random(),
                speed: 0.006 + Math.random() * 0.01,
                side: i < JET_COUNT / 2 ? 1 : -1,
                spread: (Math.random() - 0.5) * 22
            });
        }

        // ---- CLICK EFFECT STATE ----
        const ringHues = [38, 190, 320, 140, 270, 0, 55];
        let ringHueIdx = 0;
        const shockwaves = [];
        let distortSpike = 0;
        let flashAlpha = 0;

        // ---- SCROLL-TO-RESIZE EVENT HORIZON ----
        let ehScale = 1.0, ehScaleTarget = 1.0;
        window.addEventListener("wheel", (e) => {
            e.preventDefault();
            ehScaleTarget *= e.deltaY > 0 ? 0.93 : 1.075;
            ehScaleTarget = Math.max(0.4, Math.min(2.8, ehScaleTarget));
        }, { passive: false });

        function lerp(a, b, f) { return a + (b - a) * f; }

        function draw() {
            t += 0.01;
            bh.x = lerp(bh.x, mouse.x, 0.055);
            bh.y = lerp(bh.y, mouse.y, 0.055);
            ehScale = lerp(ehScale, ehScaleTarget, 0.1);

            distortSpike *= 0.82;
            flashAlpha *= 0.76;

            // ---- TRAIL FADE ----
            ctx.fillStyle = "rgba(0,0,0,0.07)";
            ctx.fillRect(0, 0, width, height);

            // ---- NEBULAE (behind stars) ----
            for (const n of nebulae) {
                n.x += n.vx; n.y += n.vy;
                if (n.x < -n.r) n.x = width + n.r;
                if (n.x > width + n.r) n.x = -n.r;
                if (n.y < -n.r) n.y = height + n.r;
                if (n.y > height + n.r) n.y = -n.r;

                const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
                g.addColorStop(0, `hsla(${n.hue},80%,55%,${n.intensity})`);
                g.addColorStop(0.4, `hsla(${(n.hue + 30) % 360},70%,40%,${n.intensity * 0.45})`);
                g.addColorStop(1, "rgba(0,0,0,0)");
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, width, height);
            }

            // ---- STARS (with click distortion spike) ----
            const distortStr = 14000 * (1 + distortSpike * 4);
            for (const s of stars) {
                s.phase += 0.018;
                const twinkle = 0.65 + Math.sin(s.phase) * 0.35;
                const dx = s.x - bh.x, dy = s.y - bh.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx);
                const warpedDist = dist + distortStr / (dist + 90) + Math.sin(dist * 0.038 - t * 2.8) * 5;
                const x = bh.x + Math.cos(angle) * warpedDist;
                const y = bh.y + Math.sin(angle) * warpedDist;
                const a = s.b * twinkle;
                ctx.fillStyle = `rgba(110,170,255,${a})`;
                ctx.fillRect(x - s.size * 0.5, y - s.size * 0.5, s.size, s.size);
                ctx.fillStyle = `rgba(190,110,255,${a * 0.45})`;
                ctx.fillRect(x - s.size * 0.5 + 1.2, y - s.size * 0.5, s.size, s.size);
                ctx.fillStyle = `rgba(80,240,220,${a * 0.45})`;
                ctx.fillRect(x - s.size * 0.5 - 1.2, y - s.size * 0.5, s.size, s.size);
            }

            // ---- SHOOTING STARS ----
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const ss = shootingStars[i];
                ss.progress += ss.speed;
                if (ss.progress > 1) { shootingStars.splice(i, 1); continue; }

                const headX = ss.sx + ss.dx * ss.length * ss.progress;
                const headY = ss.sy + ss.dy * ss.length * ss.progress;
                const tailProg = Math.max(0, ss.progress - 0.13);
                const tailX = ss.sx + ss.dx * ss.length * tailProg;
                const tailY = ss.sy + ss.dy * ss.length * tailProg;

                const fade = ss.progress < 0.1 ? ss.progress / 0.1 :
                    ss.progress > 0.85 ? (1 - ss.progress) / 0.15 : 1;

                const grad = ctx.createLinearGradient(headX, headY, tailX, tailY);
                grad.addColorStop(0, `hsla(${ss.hue},100%,92%,${fade})`);
                grad.addColorStop(0.4, `hsla(${ss.hue},100%,70%,${fade * 0.55})`);
                grad.addColorStop(1, `hsla(${ss.hue},100%,60%,0)`);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.7;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(headX, headY);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();

                // bright head pixel
                ctx.fillStyle = `hsla(${ss.hue},100%,96%,${fade})`;
                ctx.beginPath();
                ctx.arc(headX, headY, 1.4, 0, Math.PI * 2);
                ctx.fill();
            }

            // ---- ACCRETION DISK with DOPPLER BEAMING ----
            // Particles on the front-facing half (sin(angle) > 0) are relativistically
            // beamed toward the viewer: much brighter, hue-shifted warmer.
            // The back half is attenuated and slightly cooler — that's what makes
            // Gargantua's bright crescent so iconic.
            for (const p of particles) {
                p.angle += p.speed;
                const r = p.radius;
                const wave = Math.sin(p.angle * 5 + t * 2.5) * 2.5;
                const x = bh.x + Math.cos(p.angle) * (r + wave);
                const y = bh.y + Math.sin(p.angle) * (r + wave) * 0.3;

                const doppler = Math.sin(p.angle);                  // -1 (back) … +1 (front)
                const beam = 0.4 + Math.pow(Math.max(0, 0.5 + doppler * 0.5), 2.2) * 1.6;

                const baseIntensity = Math.pow(Math.max(0, 1 - (r - 65) / 240), 1.4);
                const intensity = Math.min(1, baseIntensity * beam);

                const baseHue = (t * 55 + r * 1.2 + p.hueOffset) % 360;
                const hue = baseHue + doppler * 22;
                const lightness = 50 + intensity * 28 + doppler * 12;

                ctx.beginPath();
                ctx.arc(x, y, p.size * (0.5 + intensity * 0.9), 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue},100%,${lightness}%,${intensity * 0.9})`;
                ctx.fill();
            }

            // ---- JETS ----
            for (const j of jets) {
                j.progress += j.speed;
                if (j.progress > 1) j.progress = 0;
                const x = bh.x + j.spread * j.progress;
                const y = bh.y + j.side * j.progress * 280;
                ctx.beginPath();
                ctx.arc(x, y, 1.8 * (1 - j.progress), 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${210 + j.progress * 50},100%,82%,${(1 - j.progress) * 0.22})`;
                ctx.fill();
            }

            // ---- SHOCKWAVE RINGS ----
            const diag = Math.sqrt(width * width + height * height);
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.age += 0.016;
                if (sw.age < 0) continue;
                if (sw.age > 1.4) { shockwaves.splice(i, 1); continue; }
                const p = sw.age / 1.4;
                const r = p * diag * 0.85;
                const alpha = Math.pow(1 - p, 1.6) * 0.9;
                const lw = Math.max(0.3, 2.5 * (1 - p));
                for (let c = 0; c < 3; c++) {
                    const hue = (sw.hue + c * 120) % 360;
                    const offset = (c - 1) * 7;
                    const aFrac = c === 1 ? 1 : 0.35;
                    ctx.beginPath();
                    ctx.arc(sw.x, sw.y, Math.max(1, r + offset), 0, Math.PI * 2);
                    ctx.strokeStyle = `hsla(${hue},100%,75%,${alpha * aFrac})`;
                    ctx.lineWidth = c === 1 ? lw * 1.8 : lw * 0.7;
                    ctx.stroke();
                }
            }

            // ---- EVENT HORIZON ----
            const pulse = Math.sin(t * 1.8) * 4;
            const hr = (58 + pulse) * ehScale;

            const halo = ctx.createRadialGradient(bh.x, bh.y, hr * 0.6, bh.x, bh.y, hr * 4.5);
            halo.addColorStop(0, "rgba(0,0,0,0)");
            halo.addColorStop(0.25, "rgba(70,0,180,0.12)");
            halo.addColorStop(0.55, "rgba(0,60,220,0.07)");
            halo.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(bh.x, bh.y, hr * 4.5, 0, Math.PI * 2);
            ctx.fill();

            const rh = ringHues[ringHueIdx];
            ctx.beginPath();
            ctx.arc(bh.x, bh.y, hr * 1.18, 0, Math.PI * 2);
            ctx.strokeStyle = `hsla(${rh},100%,72%,${0.32 + Math.sin(t * 2.5) * 0.1})`;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            const body = ctx.createRadialGradient(bh.x, bh.y, 0, bh.x, bh.y, hr);
            body.addColorStop(0, "rgb(0,0,0)");
            body.addColorStop(0.75, "rgba(10,0,30,0.97)");
            body.addColorStop(0.92, "rgba(50,0,110,0.55)");
            body.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = body;
            ctx.beginPath();
            ctx.arc(bh.x, bh.y, hr, 0, Math.PI * 2);
            ctx.fill();

            // ---- FLASH BLOOM ----
            if (flashAlpha > 0.005) {
                const fl = ctx.createRadialGradient(bh.x, bh.y, 0, bh.x, bh.y, Math.max(width, height) * 0.7);
                fl.addColorStop(0, `rgba(255,255,255,${flashAlpha})`);
                fl.addColorStop(0.15, `hsla(${rh},100%,80%,${flashAlpha * 0.6})`);
                fl.addColorStop(0.5, `hsla(${rh},100%,50%,${flashAlpha * 0.15})`);
                fl.addColorStop(1, "rgba(0,0,0,0)");
                ctx.fillStyle = fl;
                ctx.fillRect(0, 0, width, height);
            }

            requestAnimationFrame(draw);
        }
        draw();

        // ---- EERIE MUSIC ENGINE ----
        let audioCtx = null;
        let masterVol = null;
        let echoIn = null;
        let stepIndex = 0;
        let nextStepTime = 0;
        let loopCount = 0;

        const BPM = 50;
        const S = 60 / BPM / 2;

        const N = {
            _: 0,
            A1: 55.00, E2: 82.41,
            A2: 110.00, E3: 164.81, F3: 174.61, G3: 196.00,
            A3: 220.00, Bb3: 233.08,
            C4: 261.63, D4: 293.66, Eb4: 311.13, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00,
            C5: 523.25, D5: 587.33, E5: 659.26, F5: 698.46, A5: 880.00,
        };

        // --- MELODY A: descending dread (the original)
        const MEL_A = [
            N.E4, N._, N._, N._, N.D4, N._, N.C4, N._,
            N.Bb3, N._, N._, N._, N.A3, N._, N._, N._,
            N.G3, N._, N._, N._, N.F3, N._, N.E3, N._,
            N.A3, N._, N.Bb3, N._, N.Eb4, N._, N._, N._,
        ];
        // --- MELODY B: rising tension counter-phrase
        const MEL_B = [
            N.A3, N._, N._, N._, N.C4, N._, N.E4, N._,
            N._, N._, N.D4, N._, N._, N.F4, N._, N._,
            N.E4, N._, N._, N.D4, N.C4, N._, N.Bb3, N._,
            N.A3, N._, N._, N._, N._, N._, N._, N._,
        ];

        const SHIM_A = [
            N._, N._, N._, N.A5, N._, N._, N._, N._,
            N._, N._, N.E5, N._, N._, N._, N._, N._,
            N._, N._, N._, N._, N.C5, N._, N._, N._,
            N._, N._, N._, N._, N._, N.A4, N._, N._,
        ];
        const SHIM_B = [
            N._, N.E5, N._, N._, N._, N._, N.D5, N._,
            N._, N._, N._, N.A5, N._, N._, N._, N._,
            N._, N._, N.F5, N._, N._, N._, N._, N._,
            N.A5, N._, N._, N._, N._, N._, N.E5, N._,
        ];

        function ensureAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterVol = audioCtx.createGain();
            masterVol.gain.value = 0.14;
            masterVol.connect(audioCtx.destination);

            const delay = audioCtx.createDelay(2.0);
            const feedback = audioCtx.createGain();
            const wetGain = audioCtx.createGain();
            delay.delayTime.value = 0.42;
            feedback.gain.value = 0.48;
            wetGain.gain.value = 0.28;
            delay.connect(feedback);
            feedback.connect(delay);
            delay.connect(wetGain);
            wetGain.connect(masterVol);
            echoIn = delay;

            const droneGain = audioCtx.createGain();
            droneGain.gain.setValueAtTime(0, audioCtx.currentTime);
            droneGain.gain.linearRampToValueAtTime(0.28, audioCtx.currentTime + 5);
            droneGain.connect(masterVol);
            droneGain.connect(echoIn);
            [N.A1, N.A1 * 1.007, N.E2].forEach(freq => {
                const o = audioCtx.createOscillator();
                o.type = "sine";
                o.frequency.value = freq;
                o.connect(droneGain);
                o.start();
            });

            nextStepTime = audioCtx.currentTime + 0.05;
            tick();
        }

        function tone(freq, start, dur, vol, echo = false) {
            if (!freq || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.value = freq;
            const attack = Math.min(dur * 0.25, 0.4);
            g.gain.setValueAtTime(0.0001, start);
            g.gain.exponentialRampToValueAtTime(vol, start + attack);
            g.gain.setValueAtTime(vol, start + dur * 0.6);
            g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
            osc.connect(g);
            g.connect(masterVol);
            if (echo) g.connect(echoIn);
            osc.start(start);
            osc.stop(start + dur + 0.05);
        }

        // ---- CLICK BOOM: gravitational thud + filtered noise impact ----
        function playBoom() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            // Sub-bass sine that drops in pitch (gravitational shock)
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(28, now + 0.55);
            g.gain.setValueAtTime(0.0001, now);
            g.gain.exponentialRampToValueAtTime(0.55, now + 0.005);
            g.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
            osc.connect(g);
            g.connect(masterVol);
            g.connect(echoIn);
            osc.start(now);
            osc.stop(now + 0.75);

            // Filtered noise burst — the crack of impact, sent through the cave reverb
            const bufLen = Math.floor(audioCtx.sampleRate * 0.18);
            const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufLen; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufLen, 2.5);
            }
            const noise = audioCtx.createBufferSource();
            const noiseG = audioCtx.createGain();
            const lp = audioCtx.createBiquadFilter();
            lp.type = "lowpass";
            lp.frequency.value = 380;
            lp.Q.value = 1.4;
            noise.buffer = buf;
            noiseG.gain.value = 0.22;
            noise.connect(lp);
            lp.connect(noiseG);
            noiseG.connect(masterVol);
            noiseG.connect(echoIn);
            noise.start(now);
        }

        function tick() {
            if (!audioCtx) return;
            while (nextStepTime < audioCtx.currentTime + 0.18) {
                // Detect loop boundary and swap melodies
                if (stepIndex > 0 && stepIndex % MEL_A.length === 0) loopCount++;
                const useB = loopCount % 2 === 1;
                const mel = useB ? MEL_B : MEL_A;
                const shim = useB ? SHIM_B : SHIM_A;
                const i = stepIndex % mel.length;
                if (mel[i]) tone(mel[i], nextStepTime, S * 3.2, 0.55, true);
                if (shim[i]) tone(shim[i], nextStepTime, S * 1.6, 0.07, false);
                nextStepTime += S;
                stepIndex++;
            }
            setTimeout(tick, 50);
        }

        // Try autoplay — works in non-Chrome and when Chrome's media-engagement
        // score has already been earned by prior visits.
        window.addEventListener("load", () => { ensureAudio(); audioCtx.resume().catch(() => { }); });
        window.addEventListener("mousemove", () => { ensureAudio(); audioCtx.resume().catch(() => { }); }, { once: true });

        // ---- CLICK: start audio + cycle ring colour + spawn shockwaves + boom ----
        window.addEventListener("click", () => {
            ensureAudio();
            if (audioCtx.state === "suspended") audioCtx.resume();

            playBoom();

            ringHueIdx = (ringHueIdx + 1) % ringHues.length;
            distortSpike = 1.0;
            flashAlpha = 0.55;

            const baseHue = ringHues[ringHueIdx];
            for (let i = 0; i < 5; i++) {
                shockwaves.push({
                    x: bh.x, y: bh.y,
                    age: -i * 0.08,
                    hue: (baseHue + i * 40) % 360
                });
            }
        });
    </script>
</body>

</html>
